
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binaryanalysis"
version = "0.1.0"
description = "Binary program analysis framework"
requires-python = ">=3.12,<3.13"

dependencies = [
    "angr==9.3.4",
    "angr-data==0.1.1",
    "archinfo==9.3.4",
    "arpy==1.1.1",
    "bitarray==3.12.3",
    "bitstring==4.3.1",
    "cachetools==7.2.6",
    "capstone==5.0.9",
    "cart==1.2.3",
    "cffi==2.1.1",
    "claripy==9.3.4",
    "cle==9.3.4",
    "colorama==0.4.6",
    "cxxheaderparser==2.2.0",
    "future==1.0.0",
    "gitdb==4.0.12",
    "GitPython==3.2.1",
    "lmdb==2.1.1",
    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "minidump==0.0.24",
    "mpmath==1.3.0",
    "msgspec==0.22.0",
    "mulpyplexer==0.9",
    "networkx==3.7",
    "pefile==2024.8.26",
    "platformdirs==4.13.7",
    "protobuf==7.36.2",
    "psutil==7.2.2",
    "pycparser==3.11",
    "pycryptodome==4.2.0",
    "pydemumble==0.1.3",
    "pyelftools==0.33",
    "Pygments==2.21.0",
    "pypcode==4.0.1",
    "pyvex==9.3.4",
    "pyxbe==1.0.4",
    "pyxdia==0.1.1",
    "rich==15.0.0",
    "smmap==5.0.3",
    "sortedcontainers==2.4.0",
    "sympy==1.14.0",
    "tibs==2.0.2",
    "typing_extensions==4.16.0",
    "uefi_firmware==1.16",
    "unicorn==2.1.4",
    "z3-solver==4.13.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["emtaint*"]
